<body>
<title>Master Character List</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Crimson+Text:wght@400;600&family=JetBrains+Mono:wght@400&display=swap">
<style>
/* Layout: header nav (Master list / Characters / Addons) over one view at a time; character pages open from any name. */
:root {
  --bg: #f3efe6; --panel: #fbf8f1; --fg: #2a241b; --muted: #74695a; --line: #d9cfbd; --gold: #8a6416; --rowalt: #f1ebdf; --horde: #8c1c13; --alliance: #1f4f9e;
  --code: #efe8da;
  --display: 'Cinzel', 'Trajan Pro', Georgia, serif;
  --body: 'Crimson Text', Georgia, 'Times New Roman', serif;
  --mono: 'JetBrains Mono', ui-monospace, Menlo, monospace;
  --c-warlock: #6b5bc4; --c-priest: #6f6f6f; --c-paladin: #c0507f; --c-warrior: #8a6a45;
  --c-shaman: #0058b8; --c-mage: #2e8fb0; --c-hunter: #5e8a2e; --c-rogue: #a88f00; --c-druid: #c95f00;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #15120e; --panel: #1d1914; --fg: #ece3d0; --muted: #a39782; --line: #3a3228; --gold: #d8ad55; --rowalt: #211c16; --horde: #d9564a; --alliance: #6f9bff; --code: #120f0b;
  --c-warlock: #9a8aee; --c-priest: #f2f2f2; --c-paladin: #f48cba; --c-warrior: #c69b6d;
  --c-shaman: #3d8cff; --c-mage: #4fc3e8; --c-hunter: #aad372; --c-rogue: #fff468; --c-druid: #ff7c0a;
  color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #15120e; --panel: #1d1914; --fg: #ece3d0; --muted: #a39782; --line: #3a3228; --gold: #d8ad55; --rowalt: #211c16; --horde: #d9564a; --alliance: #6f9bff; --code: #120f0b;
  --c-warlock: #9a8aee; --c-priest: #f2f2f2; --c-paladin: #f48cba; --c-warrior: #c69b6d;
  --c-shaman: #3d8cff; --c-mage: #4fc3e8; --c-hunter: #aad372; --c-rogue: #fff468; --c-druid: #ff7c0a;
  color-scheme: dark }

body { background: var(--bg); color: var(--fg); font-family: var(--body); font-size: 17px; line-height: 1.45; }
.wrap { max-width: 1360px; margin: 0 auto; padding-block: 24px 48px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
a { color: inherit; }
:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; border-radius: 3px; }

/* header + nav */
.top { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 10px 24px; padding-bottom: 14px; margin-bottom: 22px; border-bottom: 2px solid var(--gold); }
.brand { font-family: var(--display); font-weight: 700; font-size: 1.35rem; letter-spacing: .05em; margin: 0; }
.brand small { display: block; font-family: var(--body); font-size: .85rem; letter-spacing: 0; color: var(--muted); font-weight: 400; }
nav.views { display: flex; gap: 4px; flex-wrap: wrap; }
nav.views a { text-decoration: none; font: 600 .95rem var(--body); padding: 6px 14px; border-radius: 5px; color: var(--muted); border: 1px solid transparent; }
nav.views a[aria-current="page"] { color: var(--fg); border-color: var(--line); background: var(--panel); box-shadow: inset 0 -2px 0 var(--gold); }
nav.views a:hover { color: var(--fg); }

h1 { font-family: var(--display); font-weight: 700; font-size: 1.8rem; letter-spacing: .04em; margin: 0; text-wrap: balance; }
h2 { font-family: var(--display); font-weight: 700; font-size: 1.3rem; letter-spacing: .04em; margin: 0; }
.sub { color: var(--muted); margin: 0; }
.sub b { color: var(--horde); font-weight: 600; letter-spacing: .06em; text-transform: uppercase; font-size: .8rem; }
.vhead { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 6px 24px; margin-bottom: 16px; }
section + section { margin-top: 36px; }
.stack { display: grid; gap: 12px; }

/* tables */
.scroller { overflow-x: auto; border: 1px solid var(--line); border-radius: 6px; background: var(--panel); }
table { border-collapse: collapse; width: 100%; font-variant-numeric: tabular-nums; font-size: .94rem; }
th, td { padding: 9px 7px; text-align: left; border-bottom: 1px solid var(--line); white-space: nowrap; }
thead th { font-size: .72rem; font-weight: 600; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); }
tbody tr:nth-child(even) td:not(.gap) { background: var(--rowalt); }
.master { min-width: 980px; }
.master thead .acct th { font-family: var(--display); font-size: .95rem; letter-spacing: .06em; text-transform: none; color: var(--gold); border-bottom: 2px solid var(--gold); padding-top: 14px; }
.master thead .acct th span { display: block; font-family: var(--body); font-size: .8rem; letter-spacing: 0; color: var(--muted); font-weight: 400; }
td.duo { font-family: var(--display); font-size: .8rem; color: var(--muted); letter-spacing: .06em; width: 1%; }
td.name { font-weight: 600; font-size: 1.05rem; white-space: normal; min-width: 118px; }
td.name .q { color: var(--muted); font-weight: 400; }
a.char { text-decoration: none; }
a.char:hover .nm, a.char:focus-visible .nm { color: var(--gold); text-decoration: underline; text-underline-offset: 3px; }
td.cls { font-weight: 600; }
td.empty { color: var(--muted); font-style: italic; }
.gap { width: 12px; padding: 0; border-bottom: none; background: var(--bg); border-left: 1px solid var(--line); border-right: 1px solid var(--line); }
tr.bankrow td:not(.gap) { border-top: 2px solid var(--gold); }
.c-Warlock { color: var(--c-warlock); } .c-Priest { color: var(--c-priest); } .c-Paladin { color: var(--c-paladin); }
.c-Warrior { color: var(--c-warrior); } .c-Shaman { color: var(--c-shaman); } .c-Mage { color: var(--c-mage); }
.c-Hunter { color: var(--c-hunter); } .c-Rogue { color: var(--c-rogue); } .c-Druid { color: var(--c-druid); }
.note { color: var(--muted); font-size: .92rem; margin: 12px 0 0; }
.ico { width: 22px; height: 22px; border-radius: 3px; border: 1px solid var(--line); margin-right: 6px; flex: none; }
.ic { display: inline-flex; align-items: center; }
a.wh { text-decoration: none; display: inline-flex; align-items: center; }
a.wh span { text-decoration: underline; text-decoration-color: var(--line); text-underline-offset: 3px; }
a.wh:hover span, a.wh:focus-visible span { text-decoration-color: var(--gold); color: var(--gold); }
.synced { margin: 0 0 14px; font-size: .85rem; color: var(--muted); font-style: italic; }
table.gear { width: 100%; border-collapse: collapse; margin-top: 14px; font-size: .95rem; }
table.gear th, table.gear td { text-align: left; padding: 5px 8px; border-bottom: 1px solid var(--line); }
table.gear th { font-size: .75rem; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); }
table.gear a { text-decoration: none; font-weight: 600; }
.arm { margin-left: 6px; font: 600 .72rem var(--body); letter-spacing: .04em; color: var(--muted); text-decoration: none; white-space: nowrap; }
.arm:hover { color: var(--gold, inherit); text-decoration: underline; }
.armbtn { display: inline-block; margin-top: 8px; font-weight: 600; }
.lvl { display: inline-block; margin-left: 6px; font: 600 .72rem var(--body); letter-spacing: .04em; color: var(--muted); border: 1px solid var(--line); border-radius: 99px; padding: 0 7px; vertical-align: middle; white-space: nowrap; }
.status { display: block; font-size: .8rem; color: var(--muted); font-style: italic; margin-top: 2px; }
.gets { display: block; font-weight: 400; font-size: .82rem; color: var(--gold); margin-top: 2px; }
.gets::before { content: "Receives: "; color: var(--muted); }
.grab { display: block; width: fit-content; white-space: nowrap; margin-top: 3px; font-weight: 600; font-size: .72rem; letter-spacing: .06em; text-transform: uppercase; color: var(--horde); border: 1px solid var(--horde); border-radius: 3px; padding: 0 5px; }
.warn { color: var(--horde); }

/* secondary + mail */
.sec-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 12px; }
.card { border: 1px solid var(--line); border-radius: 6px; background: var(--panel); padding: 14px 16px; display: grid; gap: 6px; min-width: 0; align-content: start; }
.card a.wh { font-weight: 600; font-size: 1.1rem; }
.card a.wh .ico { width: 30px; height: 30px; }
.card p { margin: 0; color: var(--muted); font-size: .95rem; }
.mailtbl { min-width: 860px; }
.mailtbl thead th { border-bottom: 2px solid var(--gold); }
.mailtbl td { white-space: normal; vertical-align: top; }
.mailtbl td.mat { font-weight: 600; white-space: nowrap; }
.mailtbl td.mat .matwrap { display: flex; align-items: flex-start; }
.mailtbl td.mat .ico { width: 28px; height: 28px; margin-top: 2px; }
.mailtbl td.mat small { display: block; font-weight: 400; color: var(--muted); font-size: .85rem; white-space: normal; max-width: 24ch; }
.who { display: inline-flex; align-items: baseline; gap: 6px; white-space: nowrap; margin: 0 10px 2px 0; }
.who.primary { font-weight: 600; font-size: 1.05rem; }
.acc { font-family: var(--mono); font-size: .7rem; border: 1px solid var(--line); border-radius: 3px; padding: 0 4px; color: var(--muted); }
.ph { font-family: var(--mono); font-size: .7rem; color: var(--muted); }

/* characters view */
.filters { display: flex; flex-wrap: wrap; gap: 10px; align-items: end; margin-bottom: 12px; }
.filters label { display: grid; gap: 3px; font-size: .72rem; font-weight: 600; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); }
.filters input, .filters select { font: 400 1rem var(--body); color: var(--fg); background: var(--panel); border: 1px solid var(--line); border-radius: 5px; padding: 6px 10px; min-width: 0; }
.filters input { width: min(320px, 80vw); }
.count { color: var(--muted); font-size: .92rem; margin-left: auto; }
.list { min-width: 900px; }
.list th button { all: unset; cursor: pointer; display: inline-flex; gap: 4px; align-items: center; }
.list th button:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }
.list th[aria-sort="ascending"] button::after { content: "▲"; font-size: .6rem; }
.list th[aria-sort="descending"] button::after { content: "▼"; font-size: .6rem; }
.fac { font-weight: 600; font-size: .8rem; letter-spacing: .06em; text-transform: uppercase; }
.fac.Horde { color: var(--horde); } .fac.Alliance { color: var(--alliance); }
.none { padding: 22px; text-align: center; color: var(--muted); font-style: italic; }

/* addons */
.addon-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 10px; }
.addon-grid a { display: flex; align-items: center; gap: 12px; text-decoration: none; border: 1px solid var(--line); border-radius: 6px; background: var(--panel); padding: 10px 14px; min-width: 0; }
.addon-grid img, .addon-grid .noicon { width: 36px; height: 36px; border-radius: 6px; flex: none; }
.addon-grid .at { flex: 1; min-width: 0; display: grid; gap: 2px; }
.addon-grid .at b { font-weight: 600; }
.addon-grid .at small { color: var(--muted); font-size: .85rem; line-height: 1.3; }
.addon-grid .cf { font-size: .75rem; color: var(--muted); align-self: start; margin-top: 3px; }
.addon-grid a:hover { border-color: var(--gold); }

/* character page */
.back { display: inline-block; margin-bottom: 14px; color: var(--muted); text-decoration: none; font-size: .95rem; }
.back:hover { color: var(--gold); }
.hero { display: flex; flex-wrap: wrap; gap: 16px; align-items: center; margin-bottom: 20px; }
.hero .icons { display: flex; gap: 6px; }
.hero .icons img { width: 56px; height: 56px; border-radius: 6px; border: 2px solid var(--cc); }
.hero h1 { color: var(--cc); }
.hero .meta { color: var(--muted); margin: 2px 0 0; }
.facts { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 12px; margin-bottom: 28px; }
.facts .card .lbl, .lbl { font-size: .72rem; font-weight: 600; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); margin: 0; }
.facts .card .val { font-size: 1.05rem; display: grid; gap: 4px; }
.macro-link { color: var(--gold); }
.macro-list { display: grid; gap: 8px; }
.macro-item { border: 1px solid var(--line); border-radius: 6px; background: var(--panel); overflow: hidden; }
.macro-head { display: flex; }
.macro-copy { flex: 1; min-width: 0; display: flex; justify-content: space-between; align-items: center; gap: 10px; text-align: left; background: none; border: 0; padding: 10px 14px; color: var(--fg); font: inherit; cursor: pointer; }
.macro-copy .nm { font-weight: 600; display: block; }
.macro-copy .sub2 { display: block; color: var(--muted); font-size: .88rem; }
.macro-copy .hint { font-size: .8rem; color: var(--gold); white-space: nowrap; }
.macro-copy.copied .hint { color: var(--c-hunter); }
.macro-copy:hover { background: var(--rowalt); }
.macro-toggle { border: 0; border-left: 1px solid var(--line); background: none; color: var(--muted); font: 600 .85rem var(--body); padding: 0 14px; cursor: pointer; }
.macro-item pre { margin: 0; padding: 10px 14px; border-top: 1px solid var(--line); background: var(--code); font: .85rem/1.5 var(--mono); white-space: pre-wrap; word-break: break-word; }
.macro-note { color: var(--muted); font-size: .92rem; margin: 0; }
.skills { display: grid; gap: 8px; }
.skill { display: grid; grid-template-columns: minmax(110px, 160px) 1fr; gap: 4px 14px; align-items: start; padding: 10px 12px; border: 1px solid var(--line); border-radius: 6px; background: var(--panel); }
.skill b { display: block; }
.skill .bar { height: 6px; border-radius: 3px; background: var(--line); margin-top: 6px; overflow: hidden; }
.skill .bar span { display: block; height: 100%; background: var(--gold); }
.skill .num { font-size: .82rem; color: var(--muted); }
.skill p { margin: 0; }
.plan { margin: 0; padding-left: 20px; display: grid; gap: 4px; }
@media (max-width: 520px) { .skill { grid-template-columns: 1fr; } }
.backup-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 10px; }
.card.backup { display: flex; align-items: center; gap: 10px; }
.card.backup .ico { width: 30px; height: 30px; margin: 0; }
.card.backup b { display: block; font-weight: 600; }
.card.backup .sub { font-size: .85rem; }
</style>

<div class="wrap">
  <header class="top">
    <p class="brand">Master Character List<small>WoW Forever · Shawn's roster</small></p>
    <nav class="views" aria-label="Pages">
      <a href="#master" data-view="master">Master list</a>
      <a href="#characters" data-view="characters">Characters</a>
      <a href="#addons" data-view="addons">Addons</a>
    </nav>
  </header>
  <main id="view"></main>
</div>

/* ===================== HELPERS ===================== */
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const img = (key, size = 22) => ICONS[key] ? `<img class="ico" src="${ICONS[key]}" alt="" width="${size}" height="${size}">` : '';
const slug = s => s.toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '');
const has = (c, p) => c.p1 === p || c.p2 === p;
const label = c => c.name || `${c.race} ${c.cls}`.trim();
const WH = 'https://www.wowhead.com/forever/';
function profLink(name) {
  const p = PROFS[name]; if (!p) return name ? esc(name) : '<span class="q">—</span>';
  return `<a class="wh" href="${WH}skill=${p.id}/${p.slug}" target="_blank" rel="noopener">${img(p.icon)}<span>${esc(name)}</span></a>`;
}
function raceLink(race) {
  if (!race) return '<span class="q">—</span>';
  const r = RACES[race] || {};
  const href = r.id ? `${WH}race=${r.id}/${slug(race)}` : `${WH}search?q=${encodeURIComponent(race)}`;
  return `<a class="wh" href="${href}" target="_blank" rel="noopener">${img(r.icon)}<span>${esc(race)}</span></a>`;
}
function classLink(cls) {
  if (!cls) return '<span class="q">—</span>';
  return `<a class="wh c-${esc(cls)}" href="${WH}class=${CLASSES[cls]}/${slug(cls)}" target="_blank" rel="noopener">${img('ClassIcon_' + cls)}<span>${esc(cls)}</span></a>`;
}

// One flat list of every character, in feeding order for the duos, then everyone else.
const CHARS = [];
DUOS.forEach((d, i) => ['a', 'b'].forEach(k => {
  const c = d[k]; if (!c) return;
  const partner = d[k === 'a' ? 'b' : 'a'];
  CHARS.push({ ...c, faction: 'Horde', realm: 'PvE', acct: k.toUpperCase(), pair: d.label ? null : i + 1, pairLabel: d.label || `Pair ${i + 1}`,
    role: c.role || (k === 'a' ? 'Driver' : 'Follower'), partner: d.label ? null : partner });
}));
OTHERS.forEach(c => CHARS.push({ acct: '—', pair: null, pairLabel: '—', partner: null, ...c }));
CHARS.forEach(c => { c.slug = 'c-' + slug(label(c)); });
const charLink = c => `<a class="char" href="#${c.slug}"><span class="nm">${esc(label(c))}</span></a>`;

// Mailing plan: earliest Horde duo crafter gets fed first.
const FEED = CHARS.filter(c => c.faction === 'Horde' && c.pair);
const PLAN = MATS.map(m => ({ ...m,
  recips: FEED.filter(c => m.uses.some(p => has(c, p))),
  gatherers: m.from ? FEED.filter(c => m.from.some(p => has(c, p))) : [] }));
const receives = new Map();
PLAN.forEach(p => { const c = p.recips[0]; if (c) receives.set(c.slug, [...(receives.get(c.slug) || []), p.mat]); });

const lvlTag = c => armTag(c) + (c.lvl ? `<span class="lvl">Lv ${c.lvl}</span>` : '') + (c.status ? `<span class="status">${esc(c.status)}</span>` : '');

/* ===================== LIVE ARMORY DATA ===================== */
// data/characters.json is written every few hours by .github/workflows/sync.yml (Blizzard Profile API, profile-forever-us).
// Characters show up there from level 10, after a logout. Hand-entered data stays as the fallback.
let LIVE = null;
const QCOL = { POOR: 'var(--q0, #9d9d9d)', COMMON: 'var(--fg)', UNCOMMON: '#1eff00', RARE: '#0070dd', EPIC: '#a335ee', LEGENDARY: '#ff8000' };
const ago = iso => { const m = Math.round((Date.now() - new Date(iso)) / 60000); return m < 60 ? `${m} min ago` : m < 1440 ? `${Math.round(m / 60)} h ago` : `${Math.round(m / 1440)} d ago`; };
function applyLive() {
  const by = new Map((LIVE.characters || []).filter(x => x.ok).map(x => [x.slug, x]));
  const each = c => { if (!c || !c.name) return; const l = by.get(slug(c.name)); if (!l) return; c.live = l; if (l.level) c.lvl = l.level; };
  DUOS.forEach(d => { each(d.a); each(d.b); }); OTHERS.forEach(each); CHARS.forEach(each);
}
async function loadLive() {
  try {
    const r = await fetch('data/characters.json', { cache: 'no-store' });
    if (!r.ok) return;
    LIVE = await r.json(); applyLive(); route();
  } catch (e) { /* page works without live data */ }
}
function liveSection(c) {
  const l = c.live;
  if (!l) return c.name && LIVE ? `<section class="stack"><h2>Live from the Armory</h2><p class="sub">Not on the Armory yet. Characters show up at level 10, after logging out once.</p></section>` : '';
  const fact = (lbl, val) => val == null || val === '' ? '' : `<div class="card"><p class="lbl">${lbl}</p><div class="val">${val}</div></div>`;
  const profs = (l.professions || []).filter(p => p.name);
  const gear = (l.equipment || []).filter(i => i.name);
  return `<section class="stack live">
    <h2>Live from the Armory</h2>
    <p class="sub">Synced ${LIVE && LIVE.updated_at ? ago(LIVE.updated_at) : ''}${l.last_login ? ` · last login ${ago(new Date(l.last_login).toISOString())}` : ''}</p>
    <div class="facts">
      ${fact('Level', l.level)}
      ${fact('Item level', l.ilvl ? `${l.ilvl}${l.ilvl_avg && l.ilvl_avg !== l.ilvl ? ` <span class="q">(${l.ilvl_avg} in bags)</span>` : ''}` : null)}
      ${fact('Spec', l.spec && (l.spec.active || (l.spec.trees || []).map(t => `${esc(t.name)} ${t.points}`).join(' / ')) ? esc(l.spec.active || '') + ((l.spec.trees || []).length ? ` <span class="q">${l.spec.trees.map(t => t.points ?? 0).join('/')}</span>` : '') : null)}
      ${fact('Guild', l.guild ? esc(l.guild) : null)}
    </div>
    ${profs.length ? `<div class="skills" style="margin-top:12px">${profs.map(p => `<div class="skill"><div><b>${PROFS[p.name] ? profLink(p.name) : esc(p.name)}</b><span class="num">${p.skill ?? '?'} / ${p.max ?? '?'}</span><div class="bar"><span style="width:${p.skill && p.max ? Math.min(100, Math.round(100 * p.skill / p.max)) : 0}%"></span></div></div><p>${esc(p.tier || (p.kind === 'secondary' ? 'Secondary skill' : ''))}</p></div>`).join('')}</div>` : ''}
    ${gear.length ? `<table class="gear"><thead><tr><th>Slot</th><th>Item</th><th>iLvl</th></tr></thead><tbody>${gear.map(i => `<tr><td class="q">${esc(i.slot || '')}</td><td><a href="${WH}item=${i.id}" target="_blank" rel="noopener" style="color:${QCOL[i.quality] || 'inherit'}">${esc(i.name)}</a></td><td>${i.ilvl ?? ''}</td></tr>`).join('')}</tbody></table>` : ''}
  </section>`;
}
function viewMaster() {
  const side = (c, i, k) => {
    if (!c) return '<td class="empty" colspan="5">Not decided</td>';
    const ch = CHARS.find(x => x.acct === k.toUpperCase() && label(x) === label(c) && x.faction === 'Horde');
    const gets = receives.get(ch.slug);
    return `<td>${raceLink(c.race)}</td><td class="cls">${classLink(c.cls)}</td>` +
      `<td class="name"><span class="q">“</span>${charLink(ch)}<span class="q">”</span>${lvlTag(c)}` +
      `${c.todo ? `<span class="grab">${esc(c.todo)}</span>` : ''}${gets ? `<span class="gets">${esc(gets.join(', '))}</span>` : ''}</td>` +
      `<td>${profLink(c.p1)}</td><td>${profLink(c.p2)}</td>`;
  };
  const rows = DUOS.map((d, i) => `<tr${d.label ? ' class="bankrow"' : ''}><td class="duo">${d.label ? esc(d.label) : i + 1}</td>` +
    `${side(d.a, i, 'a')}<td class="gap" aria-hidden="true"></td>${side(d.b, i, 'b')}</tr>`).join('');
  const who = (c, primary) => `<span class="who${primary ? ' primary' : ''}"><a class="char c-${esc(c.cls)}" href="#${c.slug}"><span class="nm">${esc(label(c))}</span></a>` +
    `<span class="acc">${c.acct}</span><span class="ph">pair ${c.pair}</span></span>`;
  const mail = PLAN.map(p => {
    const first = p.recips[0], notes = [];
    if (!first) notes.push(`<span class="warn">No one has ${esc(p.uses.join(' or '))} yet. Sell it or bank it.</span>`);
    if (first && p.needsMining && !has(first, 'Mining')) notes.push('Smelt into bars before mailing; this crafter can\'t smelt.');
    if (p.from && !p.gatherers.length) notes.push(`<span class="warn">No one has ${esc(p.from.join(' or '))}.</span>`);
    return `<tr><td class="mat"><div class="matwrap">${img(p.icon, 28)}<div>${esc(p.mat)}<small>${esc(p.detail)}</small></div></div></td>` +
      `<td>${first ? who(first, true) : '<span class="q">—</span>'}</td>` +
      `<td>${p.recips.slice(1).map(c => who(c, false)).join('') || '<span class="q">—</span>'}</td>` +
      `<td>${p.from ? (p.gatherers.map(c => who(c, false)).join('') || '<span class="q">—</span>') : esc(p.source)}</td>` +
      `<td>${notes.join(' ') || '<span class="q">—</span>'}</td></tr>`;
  }).join('');
  return `
  <section>
    <div class="vhead"><h1>Dualbox duos</h1><p class="sub"><b>Horde · PvE</b> &nbsp;One row per pair. Click a name for its page.</p></div>
    <div class="scroller"><table class="master" aria-label="Dualbox duos by account">
      <thead><tr class="acct"><th></th><th colspan="5">Primary account (A)<span>Driven character</span></th><th class="gap" aria-hidden="true"></th><th colspan="5">Secondary account (B)<span>Follower</span></th></tr>
      <tr><th>Pair</th><th>Race</th><th>Class</th><th>Name</th><th>Prof 1</th><th>Prof 2</th><th class="gap" aria-hidden="true"></th><th>Race</th><th>Class</th><th>Name</th><th>Prof 1</th><th>Prof 2</th></tr></thead>
      <tbody>${rows}</tbody></table></div>
    <p class="note">Legacy points are Battle.net account-wide, so it doesn't matter which side earns a craft.</p>
  </section>
  <section class="stack">
    <h2>Secondary skills</h2>
    <p class="sub">Every character can learn all three, on top of their two professions.</p>
    <div class="sec-grid">${SECONDARY.map(s => `<div class="card">${profLink(s.name)}<p>${esc(s.note)}</p></div>`).join('')}</div>
  </section>
  <section class="stack">
    <h2>Mailing list</h2>
    <p class="sub" style="max-width:70ch">Where materials go as you level. The earliest pair with the matching craft gets fed first, and later crafters take over once you level them. Built from the table above, so it updates when a character or profession changes.</p>
    <div class="scroller"><table class="mailtbl" aria-label="Where to mail materials">
      <thead><tr><th>Material</th><th>Mail to</th><th>Then</th><th>Gathered by</th><th>Notes</th></tr></thead><tbody>${mail}</tbody></table></div>
  </section>`;
}

let listState = { q: '', faction: '', cls: '', prof: '', sort: 'pair', dir: 1 };
const COLS = [
  { k: 'faction', t: 'Faction', v: c => c.faction },
  { k: 'name', t: 'Name', v: c => label(c) },
  { k: 'race', t: 'Race', v: c => c.race },
  { k: 'cls', t: 'Class', v: c => c.cls || '' },
  { k: 'p1', t: 'Prof 1', v: c => c.p1 || '' },
  { k: 'p2', t: 'Prof 2', v: c => c.p2 || '' },
  { k: 'acct', t: 'Account', v: c => c.acct },
  { k: 'pair', t: 'Pair', v: c => c.pair ?? (c.pairLabel === 'Bank' ? 90 : 99) },
  { k: 'role', t: 'Role', v: c => c.role }
];
function viewCharacters() {
  const profs = [...new Set(CHARS.flatMap(c => [c.p1, c.p2]).filter(Boolean))].sort();
  const classes = [...new Set(CHARS.map(c => c.cls).filter(Boolean))].sort();
  const opt = (v, cur, all) => `<option value="">${all}</option>` + v.map(x => `<option${x === cur ? ' selected' : ''}>${esc(x)}</option>`).join('');
  return `
  <section>
    <div class="vhead"><h1>Characters</h1><p class="sub">Every character on both factions. Sort by any column.</p></div>
    <div class="filters">
      <label for="f-q">Search<input id="f-q" type="search" placeholder="Name, race, class or profession" value="${esc(listState.q)}"></label>
      <label for="f-faction">Faction<select id="f-faction">${opt(['Horde', 'Alliance'], listState.faction, 'All')}</select></label>
      <label for="f-cls">Class<select id="f-cls">${opt(classes, listState.cls, 'All')}</select></label>
      <label for="f-prof">Profession<select id="f-prof">${opt(profs, listState.prof, 'All')}</select></label>
      <span class="count" id="f-count"></span>
    </div>
    <div class="scroller"><table class="list" aria-label="All characters">
      <thead><tr>${COLS.map(c => `<th data-k="${c.k}"><button type="button">${c.t}</button></th>`).join('')}</tr></thead>
      <tbody id="list-body"></tbody></table></div>
  </section>`;
}
function renderList() {
  const { q, faction, cls, prof, sort, dir } = listState;
  const needle = q.trim().toLowerCase();
  const col = COLS.find(c => c.k === sort);
  const rows = CHARS.filter(c =>
    (!faction || c.faction === faction) && (!cls || c.cls === cls) && (!prof || has(c, prof)) &&
    (!needle || [label(c), c.race, c.cls, c.p1, c.p2, c.role].join(' ').toLowerCase().includes(needle))
  ).sort((a, b) => {
    const x = col.v(a), y = col.v(b);
    return (typeof x === 'number' && typeof y === 'number' ? x - y : String(x).localeCompare(String(y))) * dir || label(a).localeCompare(label(b));
  });
  document.getElementById('list-body').innerHTML = rows.length ? rows.map(c => `<tr>
    <td><span class="fac ${c.faction}">${c.faction}</span></td>
    <td class="name">${charLink(c)}${lvlTag(c)}${c.todo ? `<span class="grab">${esc(c.todo)}</span>` : ''}</td>
    <td>${raceLink(c.race)}</td><td class="cls">${classLink(c.cls)}</td>
    <td>${profLink(c.p1)}</td><td>${profLink(c.p2)}</td>
    <td><span class="acc">${c.acct}</span></td><td>${esc(c.pairLabel)}</td><td>${esc(c.role)}</td></tr>`).join('')
    : `<tr><td colspan="${COLS.length}" class="none">No characters match. Clear a filter or the search.</td></tr>`;
  document.getElementById('f-count').textContent = `${rows.length} of ${CHARS.length}`;
  document.querySelectorAll('.list th').forEach(th => th.setAttribute('aria-sort', th.dataset.k === sort ? (dir > 0 ? 'ascending' : 'descending') : 'none'));
}

function viewAddons() {
  return `
  <section>
    <div class="vhead"><h1>Addons</h1><p class="sub">${ADDONS.length} addons. Each one opens a CurseForge search.</p></div>
    <div class="addon-grid">${ADDONS.map(a => `<a href="https://www.curseforge.com/wow/search?search=${encodeURIComponent(a.search || a.n)}" target="_blank" rel="noopener">` +
      `${ADDON_ICONS[a.n] ? `<img src="${ADDON_ICONS[a.n]}" alt="" width="36" height="36">` : '<span class="noicon"></span>'}` +
      `<span class="at"><b>${esc(a.n)}</b>${a.note ? `<small>${esc(a.note)}</small>` : ''}</span><span class="cf">CurseForge</span></a>`).join('')}</div>
  </section>`;
}

function viewChar(c) {
  const color = c.cls ? `var(--c-${c.cls.toLowerCase()})` : 'var(--fg)';
  const m = MACROS[c.cls];
  const gets = receives.get(c.slug);
  const partner = c.partner && CHARS.find(x => x.faction === 'Horde' && label(x) === label(c.partner));
  const fact = (lbl, val) => `<div class="card"><p class="lbl">${lbl}</p><div class="val">${val}</div></div>`;
  const macros = c.cls ? `
    <section class="stack">
      <h2>Macros</h2>
      <a class="macro-link" href="https://rankedboost.com/world-of-warcraft/forever/macros/${c.cls.toLowerCase()}/" target="_blank" rel="noopener">${esc(c.cls)} macros on Ranked Boost</a>
      ${m ? `<p class="macro-note">${esc(m.note)} Click a name to copy it. Written from beta data, so test them on the launch client first.</p>
      <div class="macro-list" data-cls="${esc(c.cls)}">${m.list.map(x => `<div class="macro-item"><div class="macro-head">
        <button type="button" class="macro-copy"><span><span class="nm">${esc(x.name)}</span>${x.note ? `<span class="sub2">${esc(x.note)}</span>` : ''}</span><span class="hint">Copy</span></button>
        <button type="button" class="macro-toggle" aria-expanded="false" aria-label="Expand ${esc(x.name)}">Expand</button></div><pre hidden>${esc(x.text)}</pre></div>`).join('')}</div>`
      : `<p class="macro-note">No saved ${esc(c.cls)} macros yet. Paste some in chat and they'll show up here.</p>`}
    </section>` : '';
  return `
  <a class="back" href="#master">← Master list</a>
  <section style="--cc:${color}">
    <div class="hero">
      <div class="icons">${RACES[c.race] ? `<img src="${ICONS[RACES[c.race].icon]}" alt="${esc(c.race)}">` : ''}${c.cls ? `<img src="${ICONS['ClassIcon_' + c.cls]}" alt="${esc(c.cls)}">` : ''}</div>
      <div><h1>${esc(label(c))}${c.lvl ? ` <span class="lvl" style="font-size:.9rem">Level ${c.lvl}</span>` : ''}</h1>${c.status ? `<p class="status">${esc(c.status)}</p>` : ''}
        <p class="meta"><span class="fac ${c.faction}">${c.faction}</span> · ${esc(c.realm)} · ${c.acct === '—' ? 'No account set' : 'Account ' + c.acct} · ${esc(c.pairLabel)} · ${esc(c.role)}</p>
        ${c.todo ? `<span class="grab">${esc(c.todo)}</span>` : ''}
        ${armoryUrl(c) ? `<div><a class="armbtn" href="${armoryUrl(c)}" target="_blank" rel="noopener">View on the Armory ↗</a>${c.lvl && c.lvl >= 10 ? '' : ' <span class="status" style="display:inline">Shows up once this character reaches level 10 and logs out.</span>'}</div>` : ''}</div>
    </div>
    <div class="facts">
      ${fact('Race', raceLink(c.race))}
      ${fact('Class', classLink(c.cls))}
      ${fact('Professions', c.p1 || c.p2 ? [c.p1, c.p2].filter(Boolean).map(profLink).join('') : '<span class="q">Not decided</span>')}
      ${partner ? fact('Dualbox partner', `<span class="ic">${img('ClassIcon_' + partner.cls)}<a class="char c-${esc(partner.cls)}" href="#${partner.slug}"><span class="nm">${esc(label(partner))}</span></a></span>`) : ''}
      ${gets ? fact('Mail to this character', esc(gets.join(', '))) : ''}
    </div>
  </section>
  ${c.note ? `<p class="note" style="margin:-12px 0 24px">${esc(c.note)}</p>` : ''}
  ${liveSection(c)}
  ${c.skills ? `<section class="stack">
    <h2>Profession notes</h2>${c.live ? '<p class="sub">Hand-entered. Live skill levels are in the Armory section above.</p>' : ''}
    <div class="skills">${c.skills.map(k => `<div class="skill"><div><b>${PROFS[k.n] ? profLink(k.n) : esc(k.n)}</b><span class="num">${k.at} / ${k.cap}</span><div class="bar"><span style="width:${Math.min(100, Math.round(100 * k.at / k.cap))}%"></span></div></div><p>${esc(k.next)}</p></div>`).join('')}</div>
  </section>` : ''}
  ${c.plan ? `<section class="stack">
    <h2>Plan</h2>
    <ul class="plan">${c.plan.map(x => `<li>${esc(x)}</li>`).join('')}</ul>
  </section>` : ''}
  ${c.backups ? `<section class="stack">
    <h2>Backup names</h2>
    <p class="sub">Other names that were in the running. The race goes with the pun.</p>
    <div class="backup-grid">${c.backups.map((b, i) => `<div class="card backup"><span class="ph">${i + 1}</span>${img(RACES[b.race] && RACES[b.race].icon, 30)}<div><b>${esc(b.name)}</b><span class="sub">${esc(b.race)}${b.note ? ` · ${esc(b.note)}` : ''}</span></div></div>`).join('')}</div>
  </section>` : ''}
  ${macros}`;
}

/* ===================== ROUTER ===================== */
function route() {
  const h = location.hash.slice(1) || 'master';
  const ch = CHARS.find(c => c.slug === h);
  const view = ch ? 'char' : (['master', 'characters', 'addons'].includes(h) ? h : 'master');
  const navCur = ch ? null : view;
  document.querySelectorAll('nav.views a').forEach(a => a.setAttribute('aria-current', a.dataset.view === navCur ? 'page' : 'false'));
  const el = document.getElementById('view');
  el.innerHTML = ch ? viewChar(ch) : view === 'characters' ? viewCharacters() : view === 'addons' ? viewAddons() : viewMaster();
  if (LIVE && LIVE.updated_at && !ch) el.insertAdjacentHTML('afterbegin', `<p class="synced">Levels synced from the Armory ${ago(LIVE.updated_at)}.</p>`);
  if (window.$WowheadPower && $WowheadPower.refreshLinks) $WowheadPower.refreshLinks();
  if (view === 'characters') renderList();
  document.title = ch ? `${label(ch)} · Master Character List` : 'Master Character List';
  window.scrollTo(0, 0);
}
window.addEventListener('hashchange', route);

/* ===================== EVENTS ===================== */
function copyText(t) {
  const fallback = () => new Promise((res, rej) => {
    const ta = document.createElement('textarea'); ta.value = t; ta.setAttribute('readonly', ''); ta.style.cssText = 'position:fixed;top:0;left:0;opacity:0';
    document.body.appendChild(ta); ta.select(); let ok = false; try { ok = document.execCommand('copy'); } catch (e) {} ta.remove(); ok ? res() : rej();
  });
  return navigator.clipboard && navigator.clipboard.writeText ? navigator.clipboard.writeText(t).catch(fallback) : fallback();
}
function setOpen(item, open) {
  const tog = item.querySelector('.macro-toggle'); item.querySelector('pre').hidden = !open;
  tog.setAttribute('aria-expanded', String(open)); tog.textContent = open ? 'Collapse' : 'Expand';
}
document.addEventListener('click', e => {
  const th = e.target.closest('.list th');
  if (th) { const k = th.dataset.k; listState.dir = listState.sort === k ? -listState.dir : 1; listState.sort = k; renderList(); return; }
  const cp = e.target.closest('.macro-copy'), tg = e.target.closest('.macro-toggle');
  if (!cp && !tg) return;
  const item = e.target.closest('.macro-item'), list = item.parentElement;
  const mac = MACROS[list.dataset.cls].list[[...list.children].indexOf(item)];
  if (tg) { setOpen(item, item.querySelector('pre').hidden); return; }
  const hint = cp.querySelector('.hint'); clearTimeout(cp._t);
  copyText(mac.text).then(() => { cp.classList.add('copied'); hint.textContent = 'Copied'; },
    () => { setOpen(item, true); hint.textContent = 'Copy failed. Select the text below.'; });
  cp._t = setTimeout(() => { cp.classList.remove('copied'); hint.textContent = 'Copy'; }, 2200);
});
document.addEventListener('input', e => {
  const map = { 'f-q': 'q', 'f-faction': 'faction', 'f-cls': 'cls', 'f-prof': 'prof' };
  if (map[e.target.id]) { listState[map[e.target.id]] = e.target.value; renderList(); }
});
route();
loadLive();
</script>

</body>
</html>
